<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPOWER｜出口業務管理</title>
<style>
:root{font-family:Inter,"Noto Sans TC",system-ui,sans-serif;color:#203446;background:#f3f5f7;font-size:14px}*{box-sizing:border-box}body{margin:0}aside{position:fixed;width:224px;inset:0 auto 0 0;background:#142c3c;color:#c4d1dc;padding:32px 22px}aside h2{color:white;letter-spacing:2px;font-size:21px;margin:0 0 4px}aside small{color:#88a4b6}nav{display:grid;gap:8px;margin-top:42px}button,a{cursor:pointer}nav button{background:transparent;color:inherit;border:0;text-align:left;padding:14px;border-radius:8px}nav button.active,nav button:hover{background:#244657;color:#fff}aside footer{position:absolute;bottom:30px;font-size:12px;line-height:1.8;color:#94adbd}main{margin-left:224px;padding:32px 40px;max-width:1700px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:2px;color:#728893}h1{font-size:28px;margin:6px 0}h2{font-size:19px}p.muted,.muted{color:#7a8995}button.primary{background:#147c75;color:#fff;border-color:#147c75}button{border:1px solid #d8e1e6;background:white;border-radius:7px;padding:10px 15px;color:#294454;font:inherit}button:hover{filter:brightness(.96)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:28px}.card,.panel{background:white;border:1px solid #e3e9ed;border-radius:12px;padding:24px}.card b{display:block;font-size:27px;margin:12px 0}.card small{color:#81909c}.panel{margin-bottom:20px;overflow:auto}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:12px;color:#7b8c98;font-weight:500;background:#f7f9fa}td,th{padding:15px 12px;border-bottom:1px solid #edf1f4}td:last-child{text-align:right}a{color:#147c75;text-decoration:none}a:hover{text-decoration:underline}.badge{display:inline-block;padding:5px 9px;border-radius:5px;background:#e9f4f0;color:#267a66;font-size:12px}.empty{text-align:center;padding:60px;color:#8596a2}.tools{display:flex;gap:8px;flex-wrap:wrap}dialog{border:0;border-radius:14px;width:min(1050px,95vw);padding:30px;color:#203446;max-height:90vh;box-shadow:0 20px 80px #142c3c44}dialog::backdrop{background:#10263777}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid label{display:grid;gap:7px;font-size:12px;color:#637987}.wide{grid-column:1/-1}input,select,textarea{font:inherit;padding:10px;border:1px solid #d7e0e5;border-radius:6px;width:100%;color:#203446;background:white}textarea{min-height:85px;resize:vertical}.edit-table td{padding:5px}.edit-table input{min-width:70px}.edit-table .description{min-width:150px}.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.alert{background:#fff4de;border:1px solid #efdfb5;border-radius:8px;padding:13px 16px;line-height:1.7;font-size:12px;margin-bottom:20px}#toast{position:fixed;bottom:25px;right:25px;background:#183b4b;color:white;border-radius:9px;padding:16px 24px;z-index:10;max-width:85vw;display:none}section.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.value{font-size:20px;font-weight:600}.sub{margin:4px 0 20px}.file-label{display:inline-block;border:1px dashed #b4c7cc;padding:12px;border-radius:7px;color:#147c75;cursor:pointer}.file-label input{display:none}@media(max-width:900px){aside{width:76px;padding:22px 8px}aside h2{font-size:11px}aside small,aside footer{display:none}nav button{padding:12px 6px;font-size:12px}main{margin-left:76px;padding:20px}.grid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.top{align-items:start}.top p{display:none}section.detail-grid{grid-template-columns:1fr}}
</style>
<aside><h2>MPOWER</h2><small>EXPORT TRADE WORKSPACE</small><nav id="nav"></nav><footer>出口業務管理系統<br>內部原型 · 本機使用</footer></aside>
<main><div class="top"><div><div class="eyebrow">SALES & OPERATIONS</div><h1 id="title">業務總覽</h1><p class="muted">從報價到收款，讓每一筆交易都有跡可循。</p></div><button class="primary" onclick="quoteForm()">＋ 建立報價單</button></div><div id="content"></div></main>
<dialog id="modal"><form id="form"><div class="panel-head"><h2 id="modalTitle"></h2><button type="button" onclick="modal.close()">✕</button></div><div id="fields"></div><div id="formError" style="color:#b3483b;margin-top:14px"></div><div class="modal-footer"><button type="button" onclick="modal.close()">取消</button><button class="primary" type="submit">儲存</button></div></form></dialog><div id="toast" role="status"></div>
<script>
const token='__TOKEN__';let state={documents:[],installments:[],receipts:[],attachments:[]},page='overview',selected=null;
const names={QT:'報價單',SO:'正式訂單',PI:'PI 形式發票',SC:'銷售合約',PO:'採購訂單',CI:'Commercial Invoice'};
const tabs=[['overview','業務總覽'],['QT','報價管理'],['SO','正式訂單'],['billing','PI／合約'],['PO','採購追蹤'],['CI','出口發票'],['ar','應收款追蹤']];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,c='USD')=>new Intl.NumberFormat('en-US',{minimumFractionDigits:c==='VND'?0:2,maximumFractionDigits:c==='VND'?0:2}).format(Number(x));
const doc=id=>state.documents.find(d=>d.id===Number(id));
const paid=id=>state.receipts.filter(r=>r.installment_id===id).reduce((s,r)=>s+Number(r.amount),0);
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.style.display='block';setTimeout(()=>t.style.display='none',4500)}
async function refresh(){const r=await fetch('/api/state');if(!r.ok)throw Error('資料讀取失敗');state=await r.json();render()}
async function send(p){const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json','X-Trade-Token':token},body:JSON.stringify(p)});const v=await r.json();if(!r.ok)throw Error(v.error);return v}
function go(p){page=p;selected=null;render()}
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');document.getElementById('title').textContent=selected?doc(selected)?.number:tabs.find(t=>t[0]===page)?.[1];if(selected)return detail(selected);const content=document.getElementById('content');if(page==='ar')return ar();if(page==='overview'){
let cards=Object.entries({TWD:'台幣',USD:'美金',VND:'越盾'}).map(([c,n])=>{const ins=state.installments.filter(i=>doc(i.order_id)?.data.currency===c);const amt=ins.reduce((s,i)=>s+Number(i.amount)-paid(i.id),0);return `<div class="card"><span>${n} · 未收餘額</span><b>${c} ${fmt(amt,c)}</b><small>${ins.length} 筆付款期別 · 各幣別分開統計</small></div>`}).join('');content.innerHTML=`<div class="alert">內部測試版本，請使用測試資料。單據版面仍需校對，尚未提供個別角色權限與正式稽核流程。</div><div class="cards">${cards}</div><div class="panel"><div class="panel-head"><h2>最近單據</h2><span class="muted">共 ${state.documents.length} 張單據</span></div>${docTable(state.documents.slice(0,12))}</div>`;return}
const ds=state.documents.filter(d=>page==='billing'?['PI','SC'].includes(d.kind):d.kind===page);content.innerHTML=`<div class="panel">${docTable(ds)}</div>`}
function docTable(ds){return ds.length?`<table><thead><tr><th>單據號碼</th><th>類型</th><th>客戶／供應商</th><th>日期</th><th>金額</th><th></th></tr></thead><tbody>${ds.map(d=>`<tr><td><a href="#" onclick="openDoc(${d.id});return false">${esc(d.number)}</a></td><td><span class="badge">${names[d.kind]}</span></td><td>${esc(d.kind==='PO'?d.data.supplier:d.data.customer)}</td><td>${esc(d.data.date)}</td><td>${d.data.currency} ${fmt(d.total,d.data.currency)}</td><td><a target="_blank" href="/print/${d.id}">列印 ↗</a></td></tr>`).join('')}</tbody></table>`:'<div class="empty">尚無單據。從建立第一張報價單開始。</div>'}
function openDoc(id){selected=id;render()}
function detail(id){const d=doc(id),a=d.data;const children=state.documents.filter(x=>x.parent===id),files=state.attachments.filter(x=>x.document_id===id);let actions=`<a href="/print/${id}" target="_blank"><button>列印／另存 PDF</button></a>`;
if(d.kind==='QT'&&!children.some(x=>x.kind==='SO'))actions+=`<button class="primary" onclick="confirmOrder(${id})">確認成單</button>`;
if(d.kind==='SO'){if(!children.some(x=>['PI','SC'].includes(x.kind)))actions+=`<button onclick="basisForm(${id})">開立 PI／合約</button>`;actions+=`<button onclick="scheduleForm(${id})">設定付款期別</button><button onclick="childForm(${id},'PO')">新增採購單</button><button onclick="childForm(${id},'CI')">建立 CI</button>`}
document.getElementById('content').innerHTML=`<div class="tools" style="margin-bottom:20px"><button onclick="selected=null;render()">← 返回列表</button>${actions}</div><section class="detail-grid"><div class="panel"><span class="badge">${names[d.kind]}</span><h2>${esc(a.customer)}</h2><p>${esc(a.address)}</p><div class="value">${a.currency} ${fmt(d.total,a.currency)}</div><p>貿易條件：${esc(a.terms||'未填寫')}</p><p>付款條件：${esc(a.payment_terms||'未填寫')}</p>${d.parent?`<a href="#" onclick="openDoc(${d.parent});return false">查看來源 ${esc(doc(d.parent)?.number)}</a>`:''}</div><div class="panel"><h2>往來文件留存</h2><p class="muted">回簽報價、客戶訂單、合約或其他附件，單檔上限 15MB。</p><label class="file-label">＋ 上傳附件<input type="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" onchange="upload(${id},this.files[0])"></label><ul>${files.map(f=>`<li><a href="/attachment/${f.id}" download="${esc(f.name)}">${esc(f.name)}</a></li>`).join('')}</ul></div></section><div class="panel"><h2>商品明細</h2><table><thead><tr><th>品牌</th><th>型號</th><th>說明</th><th>數量</th><th>單位</th><th>單價</th><th>金額</th></tr></thead><tbody>${a.items.map(i=>`<tr>${['brand','model','description','qty','unit','price','total'].map(k=>`<td>${esc(i[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${d.kind==='SO'?`<div class="panel"><h2>應收與收款紀錄</h2>${arTable(state.installments.filter(i=>i.order_id===id))}</div>`:''}${children.length?`<div class="panel"><h2>關聯單據</h2>${docTable(children)}</div>`:''}`}
async function upload(id,file){if(!file)return;try{const r=await fetch('/api/upload/'+id,{method:'POST',headers:{'X-Trade-Token':token,'X-File-Name':encodeURIComponent(file.name)},body:file});const v=await r.json();if(!r.ok)throw Error(v.error);await refresh();toast('附件已留存')}catch(e){toast(e.message)}}
async function confirmOrder(id){try{const v=await send({op:'confirm',id});selected=v.id;page='SO';await refresh();toast('已建立訂單與應收紀錄')}catch(e){toast(e.message)}}
function ar(){document.getElementById('content').innerHTML=`<div class="panel"><h2>應收款追蹤表</h2><p class="muted">付款依據、各期應收及每次收款。手續費單獨列示，不算客戶欠款。</p>${arTable(state.installments)}</div>`}
function arTable(ins){return ins.length?`<table><thead><tr><th>PI／合約號碼</th><th>客戶名稱</th><th>期別／期限</th><th>應收金額</th><th>已收／未收</th><th>收款日期與金額</th><th></th></tr></thead><tbody>${ins.map(i=>{const d=doc(i.order_id),basis=state.documents.find(x=>x.parent===d.id&&['PI','SC'].includes(x.kind)),rs=state.receipts.filter(r=>r.installment_id===i.id);return `<tr><td><a href="#" onclick="openDoc(${d.id});return false">${esc(basis?.number||d.number)}</a>${basis?'':'<br><small>付款依據待開立</small>'}</td><td>${esc(d.data.customer)}</td><td>${esc(i.label)}<br><small>${esc(i.due)}</small></td><td>${d.data.currency} ${fmt(i.amount,d.data.currency)}</td><td>${fmt(paid(i.id),d.data.currency)} ／ ${fmt(Number(i.amount)-paid(i.id),d.data.currency)}</td><td>${rs.map(r=>`${esc(r.paid_on)} · ${fmt(r.amount,d.data.currency)}<br><small>費用 ${fmt(r.fee,d.data.currency)} · 入帳 ${fmt(Number(r.amount)-Number(r.fee),d.data.currency)} ${esc(r.note)}</small>`).join('<hr>')||'尚未收款'}</td><td>${Number(i.amount)>paid(i.id)?`<button onclick="receiptForm(${i.id})">＋ 收款</button>`:'<span class="badge">已收齊</span>'}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">訂單成立後會自動建立應收紀錄。</div>'}
function field(label,name,value='',type='text',wide=false){return `<label class="${wide?'wide':''}">${label}${type==='textarea'?`<textarea name="${name}">${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}">`}</label>`}
function currency(value='USD'){return `<label>幣別<select name="currency">${['TWD','USD','VND'].map(c=>`<option ${value===c?'selected':''}>${c}</option>`).join('')}</select></label>`}
function itemEditor(rows=[{}]){return `<div class="wide"><h3>商品明細</h3><div style="overflow:auto"><table class="edit-table"><thead><tr><th>品牌</th><th>型號</th><th>品名／說明</th><th>數量</th><th>單位</th><th>單價</th><th></th></tr></thead><tbody id="itemRows">${rows.map(itemRow).join('')}</tbody></table></div><button type="button" onclick="document.getElementById('itemRows').insertAdjacentHTML('beforeend',itemRow({}))">＋ 商品</button></div>`}
function itemRow(i){return `<tr class="item">${['brand','model','description','qty','unit','price'].map(k=>`<td><input data-key="${k}" class="${k}" value="${esc(i[k]??(k==='unit'?'PCS':''))}" ${['qty','price'].includes(k)?'inputmode="decimal"':''} ${['model','qty','price'].includes(k)?'required':''}></td>`).join('')}<td><button type="button" onclick="this.closest('tr').remove()">×</button></td></tr>`}
function readItems(){return [...document.querySelectorAll('#itemRows .item')].map(r=>Object.fromEntries([...r.querySelectorAll('input')].map(x=>[x.dataset.key,x.value])))}
function show(title,fields,submit){document.getElementById('modalTitle').textContent=title;document.getElementById('fields').innerHTML=fields;document.getElementById('formError').textContent='';document.getElementById('form').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{await submit(Object.fromEntries(new FormData(e.target)));document.getElementById('modal').close();await refresh();toast('已儲存')}catch(err){document.getElementById('formError').textContent=err.message}finally{button.disabled=false}};document.getElementById('modal').showModal()}
function quoteForm(){show('建立報價單',`<div class="grid">${field('公司英文名稱','seller','MPOWER-PRO RC INDUSTRIAL CO., LTD.')}${field('公司地址','seller_address')}${field('客戶名稱','customer')}${field('客戶地址','address')}${currency()}${field('貿易條件（如 CIF CAT LAI）','terms')}${field('付款條件','payment_terms')}${field('交期','delivery')}${field('銀行／收款資料','bank','','textarea',true)}${field('合約條款（選擇合約時使用）','contract_terms','','textarea',true)}${itemEditor()}</div>`,async p=>{const v=await send({...p,op:'quote',items:readItems()});selected=v.id;page='QT'})}
function basisForm(id){show('選擇客戶付款依據','<div class="grid"><label>單據類型<select name="kind"><option value="PI">PI 形式發票</option><option value="SC">Sales Contract 銷售合約</option></select></label><p class="wide muted">沿用訂單的商品、價格、付款條件、銀行資料及合約條款。第一版開立後保留，不提供覆寫。</p></div>',p=>send({...p,op:'basis',id}))}
function scheduleRow(r={}){return `<tr class="schedule"><td><input data-key="label" value="${esc(r.label||'')}" required placeholder="訂金／尾款"></td><td><input data-key="due" value="${esc(r.due||'')}" required placeholder="2026-11-01 或裝船前"></td><td><input data-key="amount" value="${esc(r.amount||'')}" inputmode="decimal" required></td><td><button type="button" onclick="this.closest('tr').remove()">×</button></td></tr>`}
function scheduleForm(id){show('設定付款期別',`<p>各期合計須等於訂單總額 ${doc(id).data.currency} ${fmt(doc(id).total,doc(id).data.currency)}。已有收款後不可覆寫。</p><table class="edit-table"><thead><tr><th>期別</th><th>日期／事件期限</th><th>應收金額</th><th></th></tr></thead><tbody id="schedules">${state.installments.filter(i=>i.order_id===id).map(scheduleRow).join('')}</tbody></table><button type="button" onclick="document.getElementById('schedules').insertAdjacentHTML('beforeend',scheduleRow())">＋ 付款期別</button>`,()=>send({op:'schedule',id,schedule:[...document.querySelectorAll('.schedule')].map(r=>Object.fromEntries([...r.querySelectorAll('input')].map(x=>[x.dataset.key,x.value])))}))}
function receiptForm(ident){const i=state.installments.find(x=>x.id===ident),d=doc(i.order_id);show('新增收款紀錄',`<p>${esc(i.label)} · ${d.data.currency} · 未收 ${fmt(Number(i.amount)-paid(i.id),d.data.currency)}</p><div class="grid">${field('客戶付款日期','paid_on',new Date().toLocaleDateString('en-CA'),'date')}${field('客戶付款金額（同訂單幣別）','amount')}${field('銀行手續費（同幣別）','fee','0')}${field('備註／銀行交易參考號','note','','textarea',true)}</div>`,p=>send({...p,op:'receipt',id:d.id,installment:ident}))}
function childForm(id,kind){const d=doc(id);show(kind==='CI'?'建立出口 Commercial Invoice':'建立關聯採購單',`<div class="grid">${kind==='PO'?field('供應商','supplier')+currency(d.data.currency):field('船名／航次','vessel')+field('裝運日期','sailing','','date')+field('起運港','from_port')+field('目的港','to_port')+field('嘜頭','marks','','textarea')+field('金額英文大寫（人工確認）','amount_words')}${itemEditor(d.data.items)}</div><p class="muted">${kind==='CI'?'請調整為本次實際出貨數量；累計出貨不得超過訂單數量。':'商品型號須對應銷售訂單；採購價格及幣別可獨立設定。'}</p>`,async p=>{const v=await send({...p,op:kind,id,items:readItems()});selected=v.id;page=kind})}
refresh().catch(e=>toast(e.message));
</script></html>
